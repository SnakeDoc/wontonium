name: Lint Container
description: Uses hadolint to check Containerfiles for best practices and common issues.

on:
  workflow_call:
    inputs:
      file:
        required: false
        type: string
        default: "./Containerfile"

jobs:
  lint:
    name: Hadolint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v7

      - name: Hadolint Lint Check
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.file }}

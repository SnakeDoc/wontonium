name: Hadolint
description: Uses hadolint to check Containerfiles for best practices and common issues.

on:
  workflow_call:
    inputs:
      file:
        required: false
        type: string
        default: "./Containerfile"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint Lint Check
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.file }}

name: TypeSpec
description: Run TypeSpec Format

on:
  workflow_call:
    inputs:
      bun-version-file:
        required: false
        type: string
        default: "package.json"
      tsp-version:
        required: false
        type: string
        default: ""
      path:
        required: false
        type: string
        default: "**/*.tsp"

jobs:
  tsp:
    name: Format
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.bun-version-file }}

      - name: Install Dependencies
        run: bun install

      - name: TypeSpec Format
        run: bunx --bun @typespec/compiler@${{ inputs.tsp-version }} format --check ${{ inputs.path }}

name: devcontainer

on:
  push:
    branches: [main]
    paths: &paths
      - .devcontainer/Containerfile
      - .github/workflows/devcontainer.yaml
      - .github/workflows/container-build.yaml
      - .github/workflows/container-tag.yaml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  biome:
    name: Biome
    uses: ./.github/workflows/biome.yaml

  hadolint:
    name: Hadolint
    uses: ./.github/workflows/hadolint.yaml
    with:
      file: ./.devcontainer/Containerfile

  build:
    name: Build
    uses: ./.github/workflows/container-build.yaml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      name: devcontainer
      context: .devcontainer

  promote:
    name: Promote
    needs: [biome, hadolint, build]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/container-tag.yaml
    permissions:
      packages: write
    with:
      name: devcontainer
      digest: ${{ needs.build.outputs.digest }}
      tags: type=raw,value=latest
